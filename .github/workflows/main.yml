name: Galaxy A04 One UI 8.5 Build (samloader-rs)

on:
  workflow_dispatch:
    inputs:
      target:
        description: 'Build target (system | vendor | product | kernel | boot | all)'
        required: true
        default: 'all'
      stock_model:
        description: 'Stock device model (default: SM-A045F)'
        required: true
        default: 'SM-A045F'
      stock_csc:
        description: 'Stock CSC region code (e.g. ACR, EGY, XSG, INS)'
        required: true
        default: 'ACR'
      stock_imei:
        description: 'Optional IMEI if required by firmware/samloader-rs'
        required: false
        default: ''
      stock_serial:
        description: 'Optional Serial if required by firmware/samloader-rs'
        required: false
        default: ''
      system_port_url:
        description: 'Optional direct URL to prepared One UI 8.5 system archive (.tar.gz / .zip / .img)'
        required: false
        default: ''
      super_size:
        description: 'Fallback super size in bytes if stock super is not extracted (default: 8053063680)'
        required: false
        default: '8053063680'
      super_group_limit:
        description: 'Dynamic partitions group size limit in bytes (default: 8048869376)'
        required: false
        default: '8048869376'
      super_group_name:
        description: 'Dynamic partitions group name (default: mtk_dynamic_partitions)'
        required: false
        default: 'mtk_dynamic_partitions'
      strict_verify:
        description: 'Fail workflow if verify_build.sh reports failed checks (true | false)'
        required: false
        default: 'false'

jobs:
  build:
    runs-on: ubuntu-24.04
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          path: repo

      - name: Install build tools & Rust/Cargo for samloader-rs
        run: |
          set -e
          sudo apt-get update
          sudo apt-get install -y \
            git bc bison flex libssl-dev make libc6-dev libncurses5-dev \
            binutils-aarch64-linux-gnu erofs-utils android-sdk-libsparse-utils \
            mkbootimg cpio zip unzip curl wget xz-utils lz4 file attr python3 \
            cargo rustc pkg-config

      - name: Install samloader-rs
        run: |
          set -e
          if ! command -v samloader-rs >/dev/null 2>&1; then
            cargo install samloader-rs --locked || cargo install samloader-rs
          fi
          export PATH="$HOME/.cargo/bin:$PATH"
          command -v samloader-rs
          samloader-rs --help || true

      - name: Download & extract stock A04 firmware with samloader-rs
        env:
          SAMLOADER_IMEI: "${{ secrets.SAMLOADER_IMEI }}"
          SAMLOADER_SERIAL: "${{ secrets.SAMLOADER_SERIAL }}"
        run: |
          set -e
          export PATH="$HOME/.cargo/bin:$PATH"
          mkdir -p ~/a04_stock/dl ~/a04_stock/extracted ~/a04port/work/kernel ~/a04port/work/stock/super ~/a04port/logs

          MODEL="${{ inputs.stock_model }}"
          CSC="${{ inputs.stock_csc }}"
          IMEI="${{ inputs.stock_imei || env.SAMLOADER_IMEI }}"
          SERIAL="${{ inputs.stock_serial || env.SAMLOADER_SERIAL }}"

          cd ~/a04_stock/dl

          # Try common samloader-rs download invocations depending on CLI version
          if [ -n "$IMEI" ] && [ -n "$SERIAL" ]; then
            samloader-rs download -m "$MODEL" -r "$CSC" -i "$IMEI" -s "$SERIAL" -O . || \
            samloader-rs -m "$MODEL" -r "$CSC" -i "$IMEI" -s "$SERIAL" download -o . || true
          elif [ -n "$IMEI" ]; then
            samloader-rs download -m "$MODEL" -r "$CSC" -i "$IMEI" -O . || \
            samloader-rs -m "$MODEL" -r "$CSC" -i "$IMEI" download -o . || true
          else
            samloader-rs download -m "$MODEL" -r "$CSC" -O . || \
            samloader-rs -m "$MODEL" -r "$CSC" download -o . || true
          fi

          # Unpack any zip/tar/enc archives produced into ~/a04_stock/extracted
          for f in ~/a04_stock/dl/*; do
            [ -f "$f" ] || continue
            case "$f" in
              *.zip) unzip -o -q "$f" -d ~/a04_stock/extracted/ || true ;;
              *.tar.md5|*.tar) tar -xf "$f" -C ~/a04_stock/extracted/ || true ;;
            esac
          done

          # Extract AP tar if present inside extracted files
          AP_TAR=$(find ~/a04_stock/extracted -maxdepth 2 -name "AP_*.tar*" | head -n 1)
          if [ -n "$AP_TAR" ]; then
            tar -xf "$AP_TAR" -C ~/a04_stock/extracted/ || true
          fi

          # Decompress lz4 images (boot, dtbo, super)
          cd ~/a04_stock/extracted
          for lz in boot.img.lz4 dtbo.img.lz4 super.img.lz4; do
            [ -f "$lz" ] && lz4 -d -f "$lz" "${lz%.lz4}" || true
          done

          # Convert super.img to raw if sparse
          if [ -f ~/a04_stock/extracted/super.img ]; then
            if file ~/a04_stock/extracted/super.img | grep -qi "sparse"; then
              simg2img ~/a04_stock/extracted/super.img ~/a04port/work/stock/super/super_stock.raw.img
            else
              cp ~/a04_stock/extracted/super.img ~/a04port/work/stock/super/super_stock.raw.img
            fi
            command -v lpdump >/dev/null 2>&1 && lpdump ~/a04port/work/stock/super/super_stock.raw.img > ~/a04port/logs/stock-super-lpdump.txt || true
          fi

          [ -f ~/a04_stock/extracted/boot.img ] && cp ~/a04_stock/extracted/boot.img ~/a04port/work/kernel/boot.img
          [ -f ~/a04_stock/extracted/dtbo.img ] && cp ~/a04_stock/extracted/dtbo.img ~/a04port/work/kernel/dtbo.img

          ls -lh ~/a04port/work/stock/super/ ~/a04port/work/kernel/ 2>/dev/null || true

      - name: Checkout Galaxy A04 trees
        run: |
          set -e
          mkdir -p ~/a04_trees
          git clone --depth=1 https://github.com/A04-Trees-and-ROMs/android_device_samsung_a04.git ~/a04_trees/device
          git clone --depth=1 https://github.com/A04-Trees-and-ROMs/android_vendor_samsung_a04.git ~/a04_trees/vendor
          git clone --depth=1 https://github.com/A04-Trees-and-ROMs/android_kernel_samsung_a04.git ~/a04_trees/kernel

      - name: Download GCC & Clang toolchains
        run: |
          set -e
          mkdir -p ~/a04_trees/toolchain/gcc ~/a04_trees/toolchain/clang/host/linux-x86/clang-r383902

          cd ~/a04_trees/toolchain/gcc
          wget -q --show-progress --retry-connrefused --waitretry=2 --read-timeout=30 -t 5 \
            https://developer.arm.com/-/media/Files/downloads/gnu/14.2.rel1/binrel/arm-gnu-toolchain-14.2.rel1-x86_64-aarch64-none-linux-gnu.tar.xz -O gcc.tar.xz || \
            wget -q --show-progress https://github.com/ravindu644/Android-Kernel-Tutorials/releases/download/toolchains/arm-gnu-toolchain-14.2.rel1-x86_64-aarch64-none-linux-gnu.tar.xz -O gcc.tar.xz
          tar -xf gcc.tar.xz -C ./

          cd ~/a04_trees/toolchain/clang
          wget -q --show-progress https://github.com/ravindu644/Android-Kernel-Tutorials/releases/download/toolchains/clang-r383902.tar.gz -O clang.tar.gz
          tar -xzf clang.tar.gz -C host/linux-x86/clang-r383902

          if [ ! -x "host/linux-x86/clang-r383902/bin/clang" ] && [ -d "host/linux-x86/clang-r383902/clang-r383902/bin" ]; then
            mv host/linux-x86/clang-r383902/clang-r383902/* host/linux-x86/clang-r383902/
          fi

      - name: Prepare port workspace & adapt repo to Galaxy A04
        run: |
          set -e
          mkdir -p \
            ~/a04port/work/port/system \
            ~/a04port/work/port/vendor \
            ~/a04port/work/port/product \
            ~/a04port/work/out \
            ~/a04port/work/kernel \
            ~/a04port/release \
            ~/a04port/logs \
            ~/work/sys85/system \
            ~/work/sys85/config \
            ~/work/vendor_src

          cp -r "$GITHUB_WORKSPACE/repo/." ~/a04port/work/adapted_repo/

          find ~/a04port/work/adapted_repo -type f \
            \( -name "*.sh" -o -name "*.py" -o -name "*.prop" -o -name "*.json" -o -name "*.txt" -o -name "*.md" \) \
            -not -path "*/.git/*" \
            -exec sed -i \
              -e 's/a71port/a04port/g' \
              -e 's/a71/a04/g' \
              -e 's/A71/A04/g' \
              -e 's/SM-A715F/SM-A045F/g' \
              -e 's/a715f/a045f/g' \
              -e 's/sm7150/mt6765/g' \
              -e 's/SM7150/MT6765/g' {} + 2>/dev/null || true

          if [ -n "${{ inputs.system_port_url }}" ]; then
            mkdir -p ~/work/dl_sys
            wget -q --show-progress "${{ inputs.system_port_url }}" -O ~/work/dl_sys/sys_pkg
            case "${{ inputs.system_port_url }}" in
              *.zip) unzip -q ~/work/dl_sys/sys_pkg -d ~/work/sys85/system || true ;;
              *.tar.gz|*.tgz) tar -xzf ~/work/dl_sys/sys_pkg -C ~/work/sys85/system || true ;;
              *.tar.xz) tar -xJf ~/work/dl_sys/sys_pkg -C ~/work/sys85/system || true ;;
            esac
          fi

          if [ -d ~/a04_trees/vendor/proprietary/vendor ]; then
            cp -r ~/a04_trees/vendor/proprietary/vendor/* ~/work/vendor_src/
          fi

          [ -n "$(ls -A ~/work/sys85/system 2>/dev/null)" ] && cp -a ~/work/sys85/system/. ~/a04port/work/port/system/
          [ -n "$(ls -A ~/work/vendor_src 2>/dev/null)" ] && cp -a ~/work/vendor_src/. ~/a04port/work/port/vendor/
          find ~/a04port/work/port -type f \( -name "*.diff" -o -name "*.smali" \) -delete

          find ~/a04port/work/adapted_repo ~/a04_trees/device -name "*system*file_contexts*" -exec cp {} ~/work/sys85/config/system_file_contexts \; 2>/dev/null || true
          find ~/a04port/work/adapted_repo ~/a04_trees/device -name "*vendor*file_contexts*" -exec cp {} ~/work/sys85/config/vendor_file_contexts \; 2>/dev/null || true

          [ -f ~/work/sys85/config/system_file_contexts ] || echo '/system(/.*)? u:object_r:system_file:s0' > ~/work/sys85/config/system_file_contexts
          [ -f ~/work/sys85/config/vendor_file_contexts ] || echo '/vendor(/.*)? u:object_r:vendor_file:s0' > ~/work/sys85/config/vendor_file_contexts

      - name: Build EROFS & Super images for Galaxy A04
        run: |
          set -e
          TARGET="${{ inputs.target }}"
          SUPER_SIZE="${{ inputs.super_size }}"
          if [ -f ~/a04port/work/stock/super/super_stock.raw.img ]; then
            SUPER_SIZE=$(stat -c %s ~/a04port/work/stock/super/super_stock.raw.img)
            echo "Using stock super size from samloader-rs firmware: $SUPER_SIZE bytes"
          fi
          GROUP_LIMIT="${{ inputs.super_group_limit }}"
          GROUP_NAME="${{ inputs.super_group_name }}"
          MKFS=$(command -v mkfs.erofs)

          build_partition_erofs() {
            local part="$1"
            local src="$2"
            local fc="$3"
            local dst="$4"
            if [ -n "$(ls -A "$src" 2>/dev/null)" ]; then
              sed -i 's/\r$//' "$fc"
              sed -i '/^\s*$/d' "$fc"
              "$MKFS" -zlz4hc,9 --mount-point="/$part" --force-uid=0 --force-gid=0 --file-contexts="$fc" "$dst" "$src"
            else
              echo "Skip $dst: $src is empty"
            fi
          }

          if [ "$TARGET" = "system" ] || [ "$TARGET" = "all" ]; then
            build_partition_erofs "system" "$HOME/a04port/work/port/system" "$HOME/work/sys85/config/system_file_contexts" "$HOME/a04port/work/out/system.img"
          fi
          if [ "$TARGET" = "vendor" ] || [ "$TARGET" = "all" ]; then
            build_partition_erofs "vendor" "$HOME/a04port/work/port/vendor" "$HOME/work/sys85/config/vendor_file_contexts" "$HOME/a04port/work/out/vendor.img"
          fi
          if [ "$TARGET" = "product" ] || [ "$TARGET" = "all" ]; then
            mkdir -p ~/work/emptyprod
            echo '/product(/.*)? u:object_r:system_file:s0' > ~/work/emptyprod_fc
            "$MKFS" -zlz4hc,9 --mount-point=/product --force-uid=0 --force-gid=0 --file-contexts="$HOME/work/emptyprod_fc" "$HOME/a04port/work/out/product.img" "$HOME/work/emptyprod"
          fi

          if [ "$TARGET" = "all" ] && command -v lpmake >/dev/null 2>&1 && [ -f ~/a04port/work/out/system.img ] && [ -f ~/a04port/work/out/vendor.img ] && [ -f ~/a04port/work/out/product.img ]; then
            TOTAL_SZ=$(( $(stat -c %s ~/a04port/work/out/system.img) + $(stat -c %s ~/a04port/work/out/vendor.img) + $(stat -c %s ~/a04port/work/out/product.img) ))
            if [ "$TOTAL_SZ" -le "$GROUP_LIMIT" ]; then
              lpmake --metadata-size 65536 --metadata-slots 2 --super-name super \
                --device "super:${SUPER_SIZE}" --group "${GROUP_NAME}:${GROUP_LIMIT}" \
                --partition system:readonly:$(stat -c %s ~/a04port/work/out/system.img):"$GROUP_NAME" --image system="$HOME/a04port/work/out/system.img" \
                --partition vendor:readonly:$(stat -c %s ~/a04port/work/out/vendor.img):"$GROUP_NAME" --image vendor="$HOME/a04port/work/out/vendor.img" \
                --partition product:readonly:$(stat -c %s ~/a04port/work/out/product.img):"$GROUP_NAME" --image product="$HOME/a04port/work/out/product.img" \
                --output ~/a04port/work/out/super.raw.img
            else
              echo "Skip super.raw.img: partitions size ($TOTAL_SZ) exceeds group limit ($GROUP_LIMIT)"
            fi
          fi

      - name: Build Galaxy A04 Kernel & boot.img
        run: |
          set -e
          TARGET="${{ inputs.target }}"
          if [ "$TARGET" = "kernel" ] || [ "$TARGET" = "boot" ] || [ "$TARGET" = "all" ]; then
            cd ~/a04_trees/kernel
            rm -rf out
            unset HOSTAS HOSTCFLAGS KBUILD_HOSTCFLAGS HOSTLDFLAGS

            CLANG_DIR="$HOME/a04_trees/toolchain/clang/host/linux-x86/clang-r383902/bin"
            GCC_BIN_DIR=$(find "$HOME/a04_trees/toolchain/gcc" -maxdepth 3 -type d -name "bin" | head -n 1)

            export ARCH=arm64
            export SUBARCH=arm64
            export PATH="$CLANG_DIR:${GCC_BIN_DIR}:$PATH"
            export CROSS_COMPILE=aarch64-none-linux-gnu-

            DEFCONFIG=$(ls arch/arm64/configs/*a04* 2>/dev/null | head -n 1)
            [ -z "$DEFCONFIG" ] && DEFCONFIG=$(ls arch/arm64/configs/*mt6765* 2>/dev/null | head -n 1)

            if [ -n "$DEFCONFIG" ]; then
              CFG_NAME=$(basename "$DEFCONFIG")
              echo "Using defconfig: $CFG_NAME"

              find drivers/ arch/arm64/configs/ -name "Kconfig*" -exec sed -i 's/\r$//' {} + 2>/dev/null || true
              sed -i 's/\r$//' "arch/arm64/configs/$CFG_NAME" 2>/dev/null || true

              make O=out CC="$CLANG_DIR/clang" HOSTCC="$CLANG_DIR/clang" HOSTLDFLAGS="-fuse-ld=lld" "$CFG_NAME"
              make -j"$(nproc)" O=out CC="$CLANG_DIR/clang" HOSTCC="$CLANG_DIR/clang" HOSTLDFLAGS="-fuse-ld=lld" LD="$CLANG_DIR/ld.lld" AR="$CLANG_DIR/llvm-ar" NM="$CLANG_DIR/llvm-nm" OBJCOPY="$CLANG_DIR/llvm-objcopy" OBJDUMP="$CLANG_DIR/llvm-objdump" STRIP="$CLANG_DIR/llvm-strip"
              find out/arch/arm64/boot -maxdepth 1 -name "Image*" -exec cp {} ~/a04port/work/out/ \;

              KIMG=$(find out/arch/arm64/boot -maxdepth 1 -name "Image.gz-dtb" -o -name "Image.gz" -o -name "Image" | head -n 1)
              if [ -n "$KIMG" ] && command -v mkbootimg >/dev/null 2>&1; then
                mkdir -p ~/work/ramdisk_tmp
                echo "boot_placeholder" > ~/work/ramdisk_tmp/init
                (cd ~/work/ramdisk_tmp && find . | cpio -o -H newc | gzip > ~/work/ramdisk.cpio.gz)
                mkbootimg --kernel "$KIMG" --ramdisk ~/work/ramdisk.cpio.gz --header_version 2 --os_version 16.0.0 --os_patch_level 2026-11 -o ~/a04port/work/out/boot.img || true
              fi
              [ -f ~/a04port/work/out/boot.img ] && cp ~/a04port/work/out/boot.img ~/a04port/work/kernel/boot.img
              find out/arch/arm64/boot -name "*dtbo*.img" -exec cp {} ~/a04port/work/kernel/dtbo.img \; 2>/dev/null || true
            else
              echo "No A04/MT6765 defconfig found automatically; inspect arch/arm64/configs"
              exit 1
            fi
          fi

      - name: Run make_zip.py for Galaxy A04
        run: |
          set -e
          mkdir -p ~/a04port/work/kernel ~/a04port/release

          [ -f ~/a04port/work/out/boot.img ] && [ ! -f ~/a04port/work/kernel/boot.img ] && cp ~/a04port/work/out/boot.img ~/a04port/work/kernel/boot.img
          find ~/a04_trees/device ~/a04_trees/kernel -name "*dtbo*.img" -exec cp {} ~/a04port/work/kernel/dtbo.img \; 2>/dev/null || true

          [ -f ~/a04port/work/adapted_repo/installer/update-binary ] && cp ~/a04port/work/adapted_repo/installer/update-binary ~/a04port/release/update-binary
          [ -f ~/a04port/work/adapted_repo/installer/NOTICE.txt ] && cp ~/a04port/work/adapted_repo/installer/NOTICE.txt ~/a04port/release/NOTICE.txt
          [ -f ~/a04port/work/adapted_repo/NOTICE.txt ] && [ ! -f ~/a04port/release/NOTICE.txt ] && cp ~/a04port/work/adapted_repo/NOTICE.txt ~/a04port/release/NOTICE.txt

          if [ -f ~/a04port/work/out/super.raw.img ] && [ -f ~/a04port/work/kernel/boot.img ] && [ -f ~/a04port/release/update-binary ]; then
            MAKE_ZIP=$(find ~/a04port/work/adapted_repo -name "make_zip.py" | head -n 1)
            if [ -n "$MAKE_ZIP" ]; then
              chmod +x "$MAKE_ZIP"
              python3 "$MAKE_ZIP" ~/a04port/release/A04_OneUI8.5_Port.zip
              cp ~/a04port/release/A04_OneUI8.5_Port.zip ~/a04port/work/out/
            else
              echo "make_zip.py not found in adapted_repo"
              exit 1
            fi
          else
            echo "Skip make_zip.py: missing super.raw.img, boot.img, or update-binary"
          fi

      - name: Run verify_build.sh for Galaxy A04
        run: |
          VERIFY_SCRIPT=$(find ~/a04port/work/adapted_repo -name "verify_build.sh" | head -n 1)
          SUPER_SIZE="${{ inputs.super_size }}"
          if [ -f ~/a04port/work/stock/super/super_stock.raw.img ]; then
            SUPER_SIZE=$(stat -c %s ~/a04port/work/stock/super/super_stock.raw.img)
          fi
          if [ -n "$VERIFY_SCRIPT" ] && [ -f ~/a04port/work/out/super.raw.img ]; then
            chmod +x "$VERIFY_SCRIPT"
            sudo HOME="$HOME" \
              W="$HOME/a04port/work" \
              OUT="$HOME/a04port/work/out" \
              SUPER="$HOME/a04port/work/out/super.raw.img" \
              EXPECTED_SUPER_SIZE="$SUPER_SIZE" \
              EXPECTED_GROUP_LIMIT="${{ inputs.super_group_limit }}" \
              EXPECTED_GROUP_NAME="${{ inputs.super_group_name }}" \
              bash "$VERIFY_SCRIPT" "$HOME/a04port/release/A04_OneUI8.5_Port.zip" | tee ~/a04port/logs/verify_build.log
            RC=${PIPESTATUS[0]}
            cp ~/a04port/logs/verify_build.log ~/a04port/work/out/ 2>/dev/null || true
            if [ "$RC" -ne 0 ] && [ "${{ inputs.strict_verify }}" = "true" ]; then
              exit "$RC"
            fi
          else
            echo "Skip verify_build.sh: script or super.raw.img not available"
          fi

      - name: Upload build outputs
        uses: actions/upload-artifact@v5
        with:
          name: a04-oneui85-build-${{ inputs.target }}
          path: ~/a04port/work/out/*
          if-no-files-found: warn
